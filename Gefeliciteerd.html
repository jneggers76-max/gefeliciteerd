<!DOCTYPE html> <html lang="nl"> <head> <meta charset="UTF-8"> <metaname="viewport" content="width=device-width, initial-scale=1.0"> <title>Gefeliciteerd!</title> <style> body { margin: 0; padding: 0; height: 100vh; display: flex; justify-content: center; align-items: center; background: linear-gradient(135deg, #ff9a9e 0%, #fecfef 99%, #fecfef 100%); font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; overflow: hidden; text-align: center; } .card { background: white; padding: 50px 40px; border-radius: 20px; box-shadow: 0 15px 35px rgba(0,0,0,0.15); max-width: 600px; width: 90%; z-index: 10; animation: popIn 0.8s cubic-bezier(0.175, 0.885, 0.32, 1.275); } h1 { color: #ff477e; font-size: 2.5em; margin-bottom: 10px; } p { color: #333; font-size: 1.6em; font-weight: bold; margin-top: 10px; } .prize { display: inline-block; background: #ffd166; color: #333; padding: 10px 25px; border-radius: 50px; font-size: 1.8em; font-weight: 800; margin-top: 15px; box-shadow: 0 4px 10px rgba(255, 209, 102, 0.5); } @keyframes popIn { 0% { transform: scale(0.5); opacity: 0; } 100% { transform: scale(1); opacity: 1; } } .confetti { position: absolute; width: 10px; height: 10px; background-color: #f00; animation: fall linear infinite; } @keyframes fall { to { transform: translateY(105vh) rotate(720deg); } } </style> </head> <body> <divclass="card"> <h1>🎉 Gefeliciteerd Mandy, Lyn en Tim! 🎉</h1> <p>Jullie hebben</p> <div class="prize">€ 1.000,-</div> <p>gewonnen!</p> </div> <script> const colors = ['#ff477e', '#ffd166', '#06d6a0', '#118ab2', '#9b5de5']; for (let i = 0; i < 80; i++) { let confetti = document.createElement('div'); confetti.className = 'confetti'; confetti.style.left = Math.random() * 100 + 'vw'; confetti.style.top = -10 + 'px'; confetti.style.backgroundColor = colors[Math.floor(Math.random() * colors.length)]; confetti.style.animationDuration = (Math.random() * 3 + 2) + 's'; confetti.style.animationDelay = Math.random() * 2 + 's'; document.body.appendChild(confetti); } </script> </body> </html>
